name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20.x', '22.x', '24.x']
        include:
          - os: macos-latest
            node-version: '22.x'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the lockfile
      # says and fails when the lockfile and package.json disagree, so a bump that
      # was never locked breaks here instead of on a contributor's laptop.
      - name: Install dependencies
        run: npm ci

      # The unit suite drives a stub storefront over HTTP and never launches a
      # browser, so the 400 MB Chromium download is not on this job's path.
      - name: Build
        run: npx tsc -p .

      - name: Lint
        run: npx eslint .

      - name: Format
        run: npx prettier --check .

      - name: Unit suite against the storefront stub
        run: node --test dist/tests/

  browser:
    name: The browser surface launches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx tsc -p .

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No live store is reachable from CI, so the journey suites cannot run here
      # and this makes no attempt to fake one. What it does catch is the failure
      # that would otherwise reach a user on their first run: a Playwright bump
      # that changes how the surface launches, which the stub suite never touches.
      - name: The probe reaches a browser and reports rather than throwing
        run: |
          set -euo pipefail
          MAGENTO_URL=https://127.0.0.1:9999 ./bin/drexbot probe --target magento
          echo "the probe judged nothing and exited 0, which is its contract"
